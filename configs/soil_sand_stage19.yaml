# Stage 19 (docs/stage_results/STAGE19_RESULTS.md): Sand, literature PSD.
# Same pore field as configs/soil_sand.yaml (psd_parametric, lambda 2.0, seed 2);
# adds the ONE per-soil OM parameter, coating_fraction (R4): the share of the
# soil's OM placed in coating cells (porous matrix within
# stage6_coating_thickness = 2 geodesic steps of a macropore) vs. deeper in
# the matrix. It decides only WHERE OM sits; it changes no rate. Value =
# Stage 8's (stage6_coating_fraction_sand). Separate file so earlier stages
# that read configs/soil_sand.yaml are unaffected.
grid:
  n: 128
  dx: 1.0
T: 1500

pore:
  mode: psd_parametric
  psd_soil: sand
  psd_config: configs/psd_literature.yaml
  lambda: 2.0
  aggregate: false
  seed: 2
  coating_fraction: 0.8

saturation:
  mode: matric_regions
  matric_d_cut_um: 50.0
