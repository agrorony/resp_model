# Soil C -- coarse, wide pore-size spread, large homogeneous domains (lambda=8).
# v3 (equal-totals rules, MODEL_SPEC.md SS13): chosen by the P1 library scan
# (scan.py; LOGBOOK.md "v3 -- P1"). Only the pore field differs between soils;
# total OM, total B0 and total habitat sum(K) are identical per unit volume.
# v2 version archived in configs/v2/.
grid:
  shape: [40, 40]
  dx: 1.0
T: 600

pore:
  structure: gaussian
  mu: 2.3
  sigma: 0.7
  lambda: 8.0
  seed: 3

saturation:
  mode: fully_wet   # Stage 1: all pores conduct
