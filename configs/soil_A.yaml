# Soil A -- Stage 3: real measured PSD "rehovot_150z" (finest of the three
# real samples: median diameter ~122 um, 76% of pore volume in the
# 30-150 um habitable window -- see STAGE3_RESULTS.md SS1). Kept as "A" to
# match Stage 1/2's fine-textured label. Stage 1/2 lognormal params (mu,
# sigma) are gone: Stage 3 replaces the lognormal mapping entirely
# (soil_respiration_prompt_stage3.md SS3), so run.py / stage2_run.py now
# also run on this soil's real PSD, not the old synthetic field.
grid:
  n: 40
  dx: 1.0
T: 600

pore:
  mode: psd
  psd_dir: data/psd/rehovot
  lambda: 2.0        # SAME for all three soils (stage3 invariant 1: the
  aggregate: false   # only systematic difference is the PSD itself)
  seed: 1            # different per soil (realization noise only)

saturation:
  mode: global_theta   # Stage 2/3: theta swept by stage2_run.py/stage3_run.py;
  theta: 1.0            # this value is the standalone/default (run.py) saturation
