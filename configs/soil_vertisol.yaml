# Vertisol -- Stage 3.5 (soil_respiration_prompt_stage3_5.md SS2, SS5).
# Literature-informed parametric PSD (configs/psd_literature.yaml -> vertisol):
# multimodal -- clay micropores (~0.01 um) + intra-aggregate (~0.35 um) +
# shrink-swell-crack macropores (~80 um). Highest total porosity, highest
# water retention; its habitat sits in the sparse ~80 um macropore mode.
grid:
  n: 128
  dx: 1.0
T: 600

pore:
  mode: psd_parametric       # Stage 3.5: lognormal-mixture PSD from the
  psd_soil: vertisol         # literature, fed through the SAME empirical-
  psd_config: configs/psd_literature.yaml   # quantile pipeline as Stage 3.
  lambda: 2.0        # SAME for all three soils (invariant: the only
  aggregate: false   # systematic difference between soils is the PSD)
  seed: 3            # different per soil (realization noise only)

saturation:
  mode: global_theta   # Stage 3.5 runs at a single CONSTANT theta held for the
  theta: 0.6           # whole simulation (the closed-jar experiment did not dry
                       # out); stage35_run.py overrides this with THETA_CONST.
