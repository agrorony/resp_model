# Soil B -- Stage 3: real measured PSD "nlm_150z" (coarsest and by far the
# most heterogeneous of the three real samples: median diameter ~329 um, a
# long tail out to ~2330 um -- see STAGE3_RESULTS.md SS1). Kept as "B" to
# match Stage 1/2's coarse-textured label.
grid:
  n: 40
  dx: 1.0
T: 600

pore:
  mode: psd
  psd_dir: data/psd/nlm
  lambda: 2.0        # SAME for all three soils (stage3 invariant 1: the
  aggregate: false   # only systematic difference is the PSD itself)
  seed: 2            # different per soil (realization noise only)

saturation:
  mode: global_theta   # Stage 2/3: theta swept by stage2_run.py/stage3_run.py;
  theta: 1.0            # this value is the standalone/default (run.py) saturation
